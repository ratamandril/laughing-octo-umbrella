<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Todas mis notas</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page">
  <header>
    <h1>Todas mis notas</h1>
    <span class="row">
      <button class="ghost" id="exportBtn">Exportar JSON</button>
      <button class="ghost" id="importBtn">Importar JSON</button>
      <button class="ghost" id="optionsBtn">Categorías y atajo</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </span>
  </header>
  <div id="msg"></div>
  <button id="conn" class="conn-line" type="button" hidden></button>

  <div class="row grow">
    <input id="search" placeholder="Buscar por título, descripción, URL o etiqueta…">
    <label class="p-global" id="globalWrap" hidden><input type="checkbox" id="globalSearch"> Buscar también en los otros perfiles</label>
    <select id="fColor"></select>
    <select id="fTag"></select>
    <select id="fProfile" hidden></select>
    <select id="fScope">
      <option value="">Página y sitio</option>
      <option value="page">Solo de página</option>
      <option value="domain">Solo de sitio</option>
    </select>
  </div>
  <div class="row view-bar" role="group" aria-label="Visualización">
    <label>Vista
      <select id="pView">
        <option value="simple">Simple</option>
        <option value="normal">Normal</option>
        <option value="detailed">Detallada</option>
      </select>
    </label>
    <label>Orden
      <select id="pSort">
        <option value="recent">Más recientes</option>
        <option value="old">Más antiguas</option>
        <option value="az">Título A–Z</option>
      </select>
    </label>
    <label>Agrupar por
      <select id="pGroup">
        <option value="site">Sitio</option>
        <option value="profile" hidden>Perfil</option>
        <option value="none">Sin agrupar</option>
      </select>
    </label>
    <span class="grow"></span>
    <button class="ghost small" id="collapseAll">Contraer todas</button>
    <button class="ghost small" id="expandAll">Expandir todas</button>
  </div>
  <div id="count" class="muted" style="margin-top:8px"></div>
  <section id="list"></section>
  <section id="others" class="others" hidden></section>

  <dialog id="dlg">
    <h2>Editar nota</h2>
    <input id="eTitle" maxlength="150">
    <textarea id="eDesc" maxlength="2000"></textarea>
    <input id="eTags" placeholder="Etiquetas separadas por coma">
    <div class="muted">Categoría (color)</div>
    <div id="eSwatches" class="swatches"></div>
    <select id="eScope">
      <option value="page">Solo esta página (URL exacta)</option>
      <option value="domain">Todo el sitio (dominio)</option>
    </select>
    <div class="row">
      <button class="primary" id="eSave">Guardar</button>
      <button class="ghost" id="eCancel">Cancelar</button>
    </div>
    <div id="eError" class="error"></div>
  </dialog>

  <script src="storage.js"></script>
  <script src="link.js"></script>
  <script src="ui.js"></script>
  <script src="others.js"></script>
  <script src="notes.js"></script>
</body>
</html>
